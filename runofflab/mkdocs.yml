site_name: "Runoff Lab NX"
site_url: "https://help.nx.geostru.ai/runofflab/"
site_author: GeoStru
site_description: "User manual of Runoff Lab NX — probabilistic rainfall analysis, IDF curves, synthetic hyetographs and SCS-CN hydrographs."
copyright: "© GeoStru — <a href='https://www.geostru.ai' target='_blank' rel='noopener'>www.geostru.ai</a>"

docs_dir: docs

theme:
  name: material
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight: { anchor_linenums: true }
  - toc: { permalink: true, toc_depth: 3 }

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
  # Linguaggi alternativi: l'utente vede un selector 🌐 nell'header.
  # La pagina ricaricata mantiene la posizione (path) cambiando solo /it ↔ /en.
  alternate:
    - name: Italiano
      link: /runofflab/it/
      lang: it
    - name: English
      link: /runofflab/en/
      lang: en

# Nav esplicito: una sezione per lingua. La home redirect è gestita lato
# GitHub Pages → /runofflab/ ridirige a /runofflab/it/ (default).
nav:
  - 🇮🇹 Italiano:
    - Home: it/index.md
    - Quickstart: it/quickstart.md
    - Workflow completo: it/workflow.md
    - Elaborazioni probabilistiche: it/elaborazioni.md
    - Curve di pioggia: it/curve.md
    - Pluviogrammi sintetici: it/pluviogrammi.md
    - Idrogrammi SCS-CN: it/scs-cn.md
    - AI Import: it/ai-import.md
    - FAQ: it/faq.md
  - 🇬🇧 English:
    - Home: en/index.md
    - Quickstart: en/quickstart.md
    - Full workflow: en/workflow.md
    - Probabilistic analyses: en/elaborazioni.md
    - Rainfall curves: en/curve.md
    - Synthetic hyetographs: en/pluviogrammi.md
    - SCS-CN hydrographs: en/scs-cn.md
    - AI Import: en/ai-import.md
    - FAQ: en/faq.md
