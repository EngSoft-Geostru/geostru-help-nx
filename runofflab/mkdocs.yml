site_name: "Runoff Lab NX"
site_url: "https://help.nx.geostru.ai/runofflab/"
site_author: GeoStru
site_description: "User manual of Runoff Lab NX — probabilistic rainfall analysis, IDF curves, synthetic hyetographs and SCS-CN hydrographs."
copyright: "© GeoStru — <a href='https://www.geostru.ai' target='_blank' rel='noopener'>www.geostru.ai</a>"

docs_dir: docs

theme:
  name: material
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    # navigation.instant rimosso: incompatibile con il language switcher
    # contestuale del plugin i18n (causa warning in build --strict).
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Workflow completo: Full workflow
            Elaborazioni probabilistiche: Probabilistic analyses
            Curve di pioggia: Rainfall curves
            Pluviogrammi sintetici: Synthetic hyetographs
            Idrogrammi SCS-CN: SCS-CN hydrographs

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight: { anchor_linenums: true }
  - toc: { permalink: true, toc_depth: 3 }

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
  # Lo switcher di lingua è generato automaticamente dal plugin i18n
  # (reconfigure_material) a partire dall'elenco `languages`.

# Nav unico in lingua di default (it/). Il plugin i18n lo replica per ogni
# lingua scambiando il prefisso it/ → en/ e traducendo i titoli via nav_translations.
nav:
  - Home: it/index.md
  - Quickstart: it/quickstart.md
  - Workflow completo: it/workflow.md
  - Elaborazioni probabilistiche: it/elaborazioni.md
  - Curve di pioggia: it/curve.md
  - Pluviogrammi sintetici: it/pluviogrammi.md
  - Idrogrammi SCS-CN: it/scs-cn.md
  - AI Import: it/ai-import.md
  - FAQ: it/faq.md
