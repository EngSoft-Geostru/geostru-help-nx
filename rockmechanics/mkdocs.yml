site_name: "Rock Mechanics NX — Classificazioni geomeccaniche e stabilità in roccia"
site_url: "https://help.nx.geostru.ai/rockmechanics/"
site_author: GeoStru
site_description: "Manuale utente di Rock Mechanics NX: elaborazione del rilievo geostrutturale ISRM di ammassi rocciosi, classificazioni geomeccaniche (Barton Q, Bieniawski RMR / Romana SMR, Jašarević, Sen, Robertson SRMR, Singh & Goel), verifiche di stabilità per scivolamento planare e a cuneo (Sliding 3D), utility per forza d'impatto di un masso e suscettibilità sismica al crollo."
copyright: "© GeoStru — <a href='https://www.geostru.ai' target='_blank' rel='noopener'>www.geostru.ai</a>"

docs_dir: docs

theme:
  name: material
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    # navigation.instant rimosso: incompatibile con il language switcher
    # contestuale del plugin i18n (causa warning in build --strict).
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Guida rapida (5 minuti): Quick start (5 minutes)
            Workflow completo: Full workflow
            Classificazioni geomeccaniche: Rock mass classifications
            Panoramica e parametri comuni: Overview and shared parameters
            Barton (indice Q): Barton (Q index)
            Jašarević & Kovačević (indice n): Jašarević & Kovačević (n index)
            RMR modificato (Sen): Modified RMR (Sen)
            Singh & Goel (indice N): Singh & Goel (N index)
            Verifiche di stabilità: Stability analyses
            Scivolamento planare: Planar sliding
            Sliding 3D (cuneo): Sliding 3D (wedge)
            Utility: Utilities
            Forza d'impatto · crollo sismico: Block impact · seismic rockfall
            Esportazione e report: Export and report
            Formati file: File formats
            Risorse e file di esempio: Resources and sample files
            Glossario: Glossary
            Bibliografia: Bibliography
            Domande frequenti: FAQ

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - toc: { permalink: true, toc_depth: 3 }

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube
  # Lo switcher di lingua è generato automaticamente dal plugin i18n
  # (reconfigure_material) a partire dall'elenco `languages`.

# Nav unico in lingua di default (it/). Il plugin i18n lo replica per ogni
# lingua scambiando il prefisso it/ → en/ e traducendo i titoli via nav_translations.
nav:
  - Home: it/index.md
  - Guida rapida (5 minuti): it/quickstart.md
  - Workflow completo: it/workflow.md
  - Classificazioni geomeccaniche:
    - Panoramica e parametri comuni: it/classificazioni.md
    - Barton (indice Q): it/barton.md
    - Bieniawski & Romana (RMR · SMR): it/rmr-romana.md
    - Jašarević & Kovačević (indice n): it/jasarevic.md
    - RMR modificato (Sen): it/sen.md
    - SRMR (Robertson): it/robertson.md
    - Singh & Goel (indice N): it/singh-goel.md
  - Verifiche di stabilità:
    - Scivolamento planare: it/scivolamento-planare.md
    - Sliding 3D (cuneo): it/sliding-3d.md
  - Utility:
    - Forza d'impatto · crollo sismico: it/utility.md
  - Output:
    - Esportazione e report: it/export.md
    - Formati file: it/formati.md
  - Reference:
    - Risorse e file di esempio: it/risorse.md
    - Glossario: it/glossario.md
    - Bibliografia: it/bibliografia.md
    - Geoapp: it/geoapp.md
    - Domande frequenti: it/faq.md
