# Build di tutti i manuali NX e deploy su GitHub Pages → help.nx.geostru.ai
#
# Trigger:
#   - Push su main → deploy in produzione
#   - Pull request → solo build (verifica che non si rompa)
#
# Output: ogni prodotto pubblicato sotto /<prodotto>/
#         es. https://help.nx.geostru.ai/gms/it/

name: Build & Deploy NX manuals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # serve a mkdocs-material per la "git revision date"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-static-i18n pymdown-extensions

      - name: Build all products
        run: |
          mkdir -p _site
          for product in */ ; do
            # Salta cartelle non-prodotto (template, _shared, ecc.)
            case "${product%/}" in
              _template-nx|_shared|.github|.git) continue ;;
            esac
            if [ ! -f "${product}mkdocs.yml" ]; then
              echo "Skip ${product}: niente mkdocs.yml"
              continue
            fi
            echo "::group::Build ${product}"
            cd "$product"
            mkdocs build --strict --site-dir "../_site/${product%/}"
            cd ..
            echo "::endgroup::"
          done

      - name: Add landing index
        run: |
          # Landing page semplice che linka tutti i prodotti.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="it">
          <head>
            <meta charset="utf-8" />
            <title>Manuali GeoStru NX</title>
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <style>
              body{font-family:Inter,system-ui,sans-serif;max-width:780px;margin:3rem auto;padding:0 1rem;color:#1e293b;background:#f8fafc}
              h1{font-weight:800;letter-spacing:-0.02em;color:#1e3a5f}
              .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:2rem}
              .card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1.2rem;text-decoration:none;color:inherit;transition:border-color .1s}
              .card:hover{border-color:#1e3a5f;box-shadow:0 4px 12px rgba(0,0,0,.06)}
              .card h3{margin:0 0 .3rem;font-size:1rem}
              .card p{margin:0;color:#64748b;font-size:.85rem}
              footer{margin-top:3rem;color:#94a3b8;font-size:.8rem;text-align:center}
            </style>
          </head>
          <body>
            <h1>Manuali GeoStru NX</h1>
            <p>Documentazione delle applicazioni web della suite <strong>GeoStru NX</strong>.</p>
            <div class="grid" id="grid"></div>
            <footer>© <script>document.write(new Date().getFullYear())</script> GeoStru — <a href="https://www.geostru.ai">www.geostru.ai</a></footer>
            <script>
              const products = [
                { id: 'gms',           name: 'GMS NX',           desc: 'Rilievo geomeccanico, stereonet, Markland' },
                { id: 'liquiter',      name: 'LiquiTer NX',      desc: 'Analisi liquefazione (Seed, Boulanger-Idriss)' },
                { id: 'rsl',           name: 'RSL III',          desc: 'Risposta sismica locale 1D' },
                { id: 'computo',       name: 'Computo NX',       desc: 'Computo metrico estimativo + AI' },
                { id: 'trispace',      name: 'Trispace NX',      desc: 'CAD web 2D/3D + drone → GEOROCK3D' },
                { id: 'hydrogeo',      name: 'Hydrogeo NX',      desc: 'Idrogeologia, pluvio, deflusso' },
                { id: 'runofflab',     name: 'Runoff Lab NX',    desc: 'Curve di pioggia, IDF' },
                { id: 'geosection',    name: 'GeoSection NX',    desc: 'Sezioni geologiche' },
                { id: 'stratigrapher', name: 'Stratigrapher NX', desc: 'Colonne stratigrafiche' }
                // Nascosti dalla home in attesa di pubblicazione / aggiornamento manuale:
                // loadcap, tiranti, maps, converter — la doc resta navigabile via URL diretto.
              ];
              const grid = document.getElementById('grid');
              for (const p of products) {
                fetch(p.id + '/it/').then(r => {
                  if (!r.ok) return;
                  const a = document.createElement('a');
                  a.className = 'card';
                  a.href = p.id + '/it/';
                  a.innerHTML = '<h3>' + p.name + '</h3><p>' + p.desc + '</p>';
                  grid.appendChild(a);
                }).catch(() => {});
              }
            </script>
          </body>
          </html>
          HTML

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
