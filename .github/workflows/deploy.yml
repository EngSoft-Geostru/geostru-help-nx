# Build di tutti i manuali NX e deploy su GitHub Pages → help.nx.geostru.ai
#
# Trigger:
#   - Push su main → deploy in produzione
#   - Pull request → solo build (verifica che non si rompa)
#
# Output: ogni prodotto pubblicato sotto /<prodotto>/
#         es. https://help.nx.geostru.ai/gms/it/

name: Build & Deploy NX manuals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # serve a mkdocs-material per la "git revision date"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-static-i18n pymdown-extensions

      - name: Build all products
        run: |
          mkdir -p _site
          for product in */ ; do
            # Salta cartelle non-prodotto (template, _shared, ecc.)
            case "${product%/}" in
              _template-nx|_shared|.github|.git) continue ;;
            esac
            if [ ! -f "${product}mkdocs.yml" ]; then
              echo "Skip ${product}: niente mkdocs.yml"
              continue
            fi
            echo "::group::Build ${product}"
            cd "$product"
            mkdocs build --strict --site-dir "../_site/${product%/}"
            cd ..
            # Backward-compat: il vecchio URL /<prodotto>/it/ ora redirige alla root
            # (l'italiano, lingua di default, è servito su /<prodotto>/).
            if [ ! -e "_site/${product%/}/it" ]; then
              mkdir -p "_site/${product%/}/it"
              cat > "_site/${product%/}/it/index.html" <<'REDIR'
          <!doctype html><html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=../"><link rel="canonical" href="../">
          <title>Redirect</title></head><body><a href="../">Redirecting…</a>
          <script>window.location.replace('../')</script></body></html>
          REDIR
            fi
            echo "::endgroup::"
          done

      - name: Add landing index
        run: |
          # Landing page semplice che linka tutti i prodotti.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="it">
          <head>
            <meta charset="utf-8" />
            <title>Manuali GeoStru NX</title>
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <style>
              *{box-sizing:border-box}
              body{font-family:Inter,system-ui,sans-serif;max-width:860px;margin:3rem auto;padding:0 1.2rem;color:#1e293b;background:#f8fafc}
              h1{font-weight:800;letter-spacing:-0.02em;color:#1e3a5f}
              .subtitle{color:#64748b;margin-top:.3rem}
              .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-top:2rem}
              .card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1.1rem 1.2rem 0.9rem;text-decoration:none;color:inherit;transition:border-color .12s,box-shadow .12s;display:flex;flex-direction:column;gap:.5rem}
              .card:hover{border-color:#1e3a5f;box-shadow:0 4px 14px rgba(0,0,0,.07)}
              .card h3{margin:0;font-size:1rem;font-weight:700}
              .card p{margin:0;color:#64748b;font-size:.84rem;flex:1}
              .langs{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.15rem}
              .langs a{font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:#f1f5f9;color:#475569;text-decoration:none;border:1px solid #e2e8f0;transition:background .1s,color .1s}
              .langs a:hover{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
              footer{margin-top:3rem;color:#94a3b8;font-size:.8rem;text-align:center}
            </style>
          </head>
          <body>
            <h1>Manuali GeoStru NX</h1>
            <p class="subtitle">Documentazione delle applicazioni web della suite <strong>GeoStru NX</strong>.</p>
            <div class="grid" id="grid"></div>
            <footer>© <script>document.write(new Date().getFullYear())</script> GeoStru — <a href="https://www.geostru.ai">www.geostru.ai</a></footer>
            <script>
              // langs: array di codici lingua disponibili per il manuale.
              // Se ha solo 'it', nessun flag viene mostrato (manuale solo italiano).
              const products = [
                { id: 'dynprobe',      name: 'Dynamic Probing NX', desc: 'Prove penetrometriche DPL·DPM·DPH·DPSH + SPT in foro', langs: ['it','en','ro','es'] },
                { id: 'gms',           name: 'GMS NX',              desc: 'Rilievo geomeccanico, stereonet, Markland',            langs: ['it','en','ro','es'] },
                { id: 'liquiter',      name: 'LiquiTer NX',         desc: 'Analisi liquefazione (Seed, Boulanger-Idriss)',        langs: ['it','en'] },
                { id: 'rsl',           name: 'RSL III',             desc: 'Risposta sismica locale 1D',                          langs: ['it','en'] },
                { id: 'computo',       name: 'Computo NX',          desc: 'Computo metrico estimativo + AI',                     langs: ['it'] },
                { id: 'trispace',      name: 'Trispace NX',         desc: 'CAD web 2D/3D + drone → GEOROCK3D',                  langs: ['it'] },
                { id: 'hydrogeo',      name: 'Hydrogeo NX',         desc: 'Idrogeologia, pluvio, deflusso',                     langs: ['it'] },
                { id: 'runofflab',     name: 'Runoff Lab NX',       desc: 'Curve di pioggia, IDF',                              langs: ['it','en'] },
                { id: 'geosection',    name: 'GeoSection NX',       desc: 'Sezioni geologiche',                                 langs: ['it','en'] },
                { id: 'stratigrapher', name: 'Stratigrapher NX',    desc: 'Colonne stratigrafiche',                             langs: ['it'] },
                { id: 'rockplane',     name: 'RockPlane NX',        desc: 'Stabilità pendii rocciosi planari (Hoek-Bray)',       langs: ['it','en'] },
                { id: 'rockmechanics', name: 'Rock Mechanics NX',   desc: 'Classificazioni geomeccaniche (RMR·Q·SMR) + stabilità planare/cuneo', langs: ['it','en'] }
                // Nascosti dalla home in attesa di aggiornamento manuale:
                // loadcap, tiranti, maps, converter — navigabili via URL diretto.
              ];
              const langLabel = { it: '🇮🇹 IT', en: '🇬🇧 EN', ro: '🇷🇴 RO', es: '🇪🇸 ES' };
              const grid = document.getElementById('grid');
              for (const p of products) {
                fetch(p.id + '/').then(r => {
                  if (!r.ok) return;
                  const card = document.createElement('a');
                  card.className = 'card';
                  card.href = p.id + '/';
                  // titolo + descrizione
                  const h = document.createElement('h3');
                  h.textContent = p.name;
                  const desc = document.createElement('p');
                  desc.textContent = p.desc;
                  card.appendChild(h);
                  card.appendChild(desc);
                  // selector lingua (solo se più di una)
                  if (p.langs && p.langs.length > 1) {
                    const row = document.createElement('div');
                    row.className = 'langs';
                    for (const l of p.langs) {
                      const a = document.createElement('a');
                      // L'italiano (lingua di default) è servito sulla root del prodotto.
                      a.href = l === 'it' ? p.id + '/' : p.id + '/' + l + '/';
                      a.textContent = langLabel[l] || l.toUpperCase();
                      a.onclick = e => e.stopPropagation(); // evita che il click sulla card apra /it/
                      row.appendChild(a);
                    }
                    card.appendChild(row);
                  }
                  grid.appendChild(card);
                }).catch(() => {});
              }
            </script>
          </body>
          </html>
          HTML

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
