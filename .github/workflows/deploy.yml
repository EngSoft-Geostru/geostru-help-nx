# Build di tutti i manuali NX e deploy su GitHub Pages → help.nx.geostru.ai
#
# Trigger:
#   - Push su main → deploy in produzione
#   - Pull request → solo build (verifica che non si rompa)
#
# Output: ogni prodotto pubblicato sotto /<prodotto>/
#         es. https://help.nx.geostru.ai/gms/it/

name: Build & Deploy NX manuals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # serve a mkdocs-material per la "git revision date"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-static-i18n pymdown-extensions

      - name: Build all products
        run: |
          mkdir -p _site
          for product in */ ; do
            # Salta cartelle non-prodotto (template, _shared, ecc.)
            case "${product%/}" in
              _template-nx|_shared|_landing|.github|.git) continue ;;
            esac
            if [ ! -f "${product}mkdocs.yml" ]; then
              echo "Skip ${product}: niente mkdocs.yml"
              continue
            fi
            echo "::group::Build ${product}"
            cd "$product"
            mkdocs build --strict --site-dir "../_site/${product%/}"
            cd ..
            # Backward-compat: il vecchio URL /<prodotto>/it/ ora redirige alla root
            # (l'italiano, lingua di default, è servito su /<prodotto>/).
            if [ ! -e "_site/${product%/}/it" ]; then
              mkdir -p "_site/${product%/}/it"
              cat > "_site/${product%/}/it/index.html" <<'REDIR'
          <!doctype html><html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=../"><link rel="canonical" href="../">
          <title>Redirect</title></head><body><a href="../">Redirecting…</a>
          <script>window.location.replace('../')</script></body></html>
          REDIR
            fi
            echo "::endgroup::"
          done

      - name: Add landing index
        run: |
          # Landing page: sorgente versionato in _landing/index.html
          cp _landing/index.html _site/index.html

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
