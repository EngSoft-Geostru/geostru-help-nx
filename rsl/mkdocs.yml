site_name: "RSL III"
site_url: "https://help.nx.geostru.ai/rsl/"
site_author: GeoStru
site_description: "Manuale utente di RSL III — Risposta sismica locale 1D."
copyright: "© GeoStru — <a href='https://www.geostru.ai' target='_blank' rel='noopener'>www.geostru.ai</a>"

# repo_name / repo_url / edit_uri rimossi: il sito è destinato all'utente finale
# e non vogliamo esporre il repo GitHub dei sorgenti dalla navbar.

docs_dir: docs

theme:
  name: material
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - toc: { permalink: true, toc_depth: 3 }

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
  alternate:
    - name: Italiano
      link: /rsl/it/
      lang: it
    - name: English
      link: /rsl/en/
      lang: en

nav:
  - Italiano:
    - Home: it/index.md
    - Quickstart: it/quickstart.md
    - Workflow completo: it/workflow.md
    - Input:
      - Dati di input: it/dati-input.md
    - Calcolo:
      - Metodo lineare equivalente: it/metodo.md
    - Output:
      - Fattori di amplificazione (ICMS): it/icms.md
    - FAQ: it/faq.md
  - English:
    - Home: en/index.md
    - Quickstart: en/quickstart.md
    - Complete workflow: en/workflow.md
    - Input:
      - Input data: en/dati-input.md
    - Calculation:
      - Equivalent-linear method: en/metodo.md
    - Output:
      - Amplification factors (ICMS): en/icms.md
    - FAQ: en/faq.md
