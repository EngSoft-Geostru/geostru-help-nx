site_name: "RSL III"
site_url: "https://help.nx.geostru.ai/rsl/"
site_author: GeoStru
site_description: "Manuale utente di RSL III — Risposta sismica locale 1D."
copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"

# repo_name / repo_url / edit_uri rimossi: il sito è destinato all'utente finale
# e non vogliamo esporre il repo GitHub dei sorgenti dalla navbar.

docs_dir: docs

theme:
  name: material
  custom_dir: ../_shared/overrides
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"
          name: Italiano
          default: true
          build: true
        - locale: en
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. All rights reserved · <a href='https://geostru.ai/en/terms-of-service/' target='_blank' rel='noopener'>Terms of Service</a> · <a href='https://geostru.ai/en/intellectual-property/' target='_blank' rel='noopener'>Intellectual property</a>"
          name: English
          build: true
          nav_translations:
            Workflow completo: Complete workflow
            Dati di input: Input data
            Calcolo: Calculation
            Metodo lineare equivalente: Equivalent-linear method
            Fattori di amplificazione (ICMS): Amplification factors (ICMS)

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - toc: { permalink: true, toc_depth: 3 }

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru

nav:
  - Home: it/index.md
  - Quickstart: it/quickstart.md
  - Workflow completo: it/workflow.md
  - Input:
    - Dati di input: it/dati-input.md
  - Calcolo:
    - Metodo lineare equivalente: it/metodo.md
  - Output:
    - Fattori di amplificazione (ICMS): it/icms.md
  - FAQ: it/faq.md
