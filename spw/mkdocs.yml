site_name: "SPW NX — Paratie"
site_url: "https://help.nx.geostru.ai/spw/"
site_author: GeoStru
site_description: "Manuale utente di SPW NX — paratie di pali, micropali e diaframmi: combinazioni, terreno, tiranti e puntoni, fasi costruttive, FEM, risultati, verifiche, armature, importazione dal desktop, relazione Word e DXF."
copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"
repo_name: EngSoft-Geostru/geostru-help-nx
repo_url: https://github.com/EngSoft-Geostru/geostru-help-nx
edit_uri: edit/main/spw/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: ../_shared/overrides
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"
          name: Italiano
          default: true
          build: true
        - locale: en
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. All rights reserved · <a href='https://geostru.ai/en/terms-of-service/' target='_blank' rel='noopener'>Terms of Service</a> · <a href='https://geostru.ai/en/intellectual-property/' target='_blank' rel='noopener'>Intellectual property</a>"
          name: English
          build: true
          site_name: "SPW NX — Embedded retaining walls"
          nav_translations:
            Guida rapida (5 minuti): Quick start (5 minutes)
            Flusso di lavoro: Workflow
            Combinazioni: Combinations
            Fasi costruttive: Construction stages
            Metodi di calcolo: Calculation methods
            Importazione dal desktop: Desktop import
            Formati e scambio dei dati: Formats and data exchange
            Crediti: Credits
            Assistente AI: AI assistant
            Validazione e limiti: Validation and limits
            Glossario: Glossary
            Domande frequenti: Frequently asked questions

hooks:
  - ../_shared/hooks/riservato.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - pymdownx.arithmatex: { generic: true }
  - toc: { permalink: true, toc_depth: 3 }

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube

nav:
  - Home: it/index.md
  - Guida rapida (5 minuti): it/quickstart.md
  - Flusso di lavoro: it/workflow.md
  - Combinazioni: it/combinazioni.md
  - Fasi costruttive: it/fasi.md
  - Metodi di calcolo: it/metodi.md
  - Importazione dal desktop: it/importazione-desktop.md
  - Formati e scambio dei dati: it/formati.md
  - Crediti: it/crediti.md
  - Assistente AI: it/assistente.md
  - Validazione e limiti: it/validazione.md
  - Glossario: it/glossario.md
  - Domande frequenti: it/faq.md
