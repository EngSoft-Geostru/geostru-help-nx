site_name: "MRE NX — Terre rinforzate"
site_url: "https://help.nx.geostru.ai/mre/"
site_author: GeoStru
site_description: "Manuale utente di MRE NX — verifica e progetto di opere di sostegno in terra rinforzata: combinazioni NTC 2018 statica/sismica, verifiche esterne e interne sui rinforzi, stabilità globale con Bishop e superfici tieback/compound, archivio rinforzi, relazione di calcolo."
copyright: "© GeoStru — <a href='https://www.geostru.ai' target='_blank' rel='noopener'>www.geostru.ai</a>"
repo_name: EngSoft-Geostru/geostru-help-nx
repo_url: https://github.com/EngSoft-Geostru/geostru-help-nx
edit_uri: edit/main/mre/docs/

docs_dir: docs

theme:
  name: material
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Guida rapida (5 minuti): Quick start (5 minutes)
            Geometria della sezione: Cross-section geometry
            Terreni, sovraccarico e parametri: Soils, surcharge and parameters
            Normativa e combinazioni: Design code and load combinations
            Azione sismica: Seismic action
            Rinforzi e archivio: Reinforcements and archive
            Verifiche esterne e interne: External and internal checks
            Stabilità globale, tieback e compound: Global, tieback and compound stability
            Relazione ed esportazioni: Report and exports
            Progetti di esempio: Sample projects
            Domande frequenti: FAQ

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tilde          # pedici k~h~, t~ult~, RF~d~ (e ~~barrato~~)
  - pymdownx.arithmatex: { generic: true }
  - toc: { permalink: true, toc_depth: 3 }

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube

# Nav unico in lingua di default (it/). Il plugin i18n lo replica per ogni lingua.
nav:
  - Home: it/index.md
  - Guida rapida (5 minuti): it/quickstart.md
  - Geometria della sezione: it/geometria.md
  - Terreni, sovraccarico e parametri: it/parametri.md
  - Normativa e combinazioni: it/combinazioni.md
  - Azione sismica: it/sisma.md
  - Rinforzi e archivio: it/rinforzi.md
  - Verifiche esterne e interne: it/verifiche.md
  - Stabilità globale, tieback e compound: it/stabilita.md
  - Relazione ed esportazioni: it/relazione.md
  - Progetti di esempio: it/esempi.md
  - Domande frequenti: it/faq.md
