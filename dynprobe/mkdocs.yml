markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - toc: { permalink: true, toc_depth: 3 }

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube

# Nav unico in lingua di default (it/). Il plugin i18n lo replica per ogni
# lingua scambiando il prefisso it/ → en/ e traducendo i titoli via nav_translations.
nav:
  - Home: it/index.md
  - Guida rapida (5 minuti): it/quickstart.md
  - Strumenti: it/strumenti.md
  - Stratigrafia interpretata: it/stratigrafia.md
  - Correlazioni geotecniche: it/correlazioni.md
  - Categoria di sottosuolo: it/categoria.md
  - Portanza fondazioni: it/portanze.md
  - Valori caratteristici EC7 / NTC: it/caratter.md
  - Esportazione e report: it/export.md
  - Formato file (.dprobe · .dypx): it/formati.md
  - Risorse e file di esempio: it/risorse.md
  - Domande frequenti: it/faq.md
