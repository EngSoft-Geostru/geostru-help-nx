site_name: "Dynamic Probing NX"
site_url: "https://help.nx.geostru.ai/dynprobe/"
site_author: GeoStru
site_description: "User manual for Dynamic Probing NX — dynamic penetration tests (DPL · DPM · DPH · DPSH) and SPT in borehole. Automatic stratigraphy, geotechnical correlations, NTC 2018 / EC8 subsoil category, foundation bearing capacity, EC7 characteristic values."
copyright: "© GeoStru — <a href='https://www.geostru.ai' target='_blank' rel='noopener'>www.geostru.ai</a>"

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark theme
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light theme
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en, ro, es]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - toc: { permalink: true, toc_depth: 3 }

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube
  alternate:
    - name: Italiano
      link: /dynprobe/it/
      lang: it
    - name: English
      link: /dynprobe/en/
      lang: en
    - name: Română
      link: /dynprobe/ro/
      lang: ro
    - name: Español
      link: /dynprobe/es/
      lang: es

