site_name: "Privacy e protezione dei dati — GeoStru NX"
site_url: "https://help.nx.geostru.ai/gdpr/"
site_author: GeoStru
site_description: "Come GeoStru tratta e protegge i dati nelle app NX e in GeoDropbox — sintesi informativa GDPR."
copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"

docs_dir: docs

theme:
  name: material
  custom_dir: ../_shared/overrides
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle: { icon: material/brightness-7, name: Tema scuro }
    - scheme: slate
      primary: blue
      accent: indigo
      toggle: { icon: material/brightness-4, name: Tema chiaro }
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  # lunr non ha uno stemmer per il polacco: includerlo qui fa fallire la build.
  - search:
      lang: [it, en, de, fr, ro, es]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - { locale: it, name: Italiano, default: true, build: true }
        - locale: en
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. All rights reserved · <a href='https://geostru.ai/en/terms-of-service/' target='_blank' rel='noopener'>Terms of Service</a> · <a href='https://geostru.ai/en/intellectual-property/' target='_blank' rel='noopener'>Intellectual property</a>"
          name: English
          build: true
          nav_translations: { "Privacy e GDPR": "Privacy & data protection" }
        - locale: de
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Alle Rechte vorbehalten · <a href='https://geostru.ai/de/terms-of-service/' target='_blank' rel='noopener'>Nutzungsbedingungen</a> · <a href='https://geostru.ai/de/intellectual-property/' target='_blank' rel='noopener'>Geistiges Eigentum</a>"
          name: Deutsch
          build: true
          nav_translations: { "Privacy e GDPR": "Datenschutz & DSGVO" }
        - locale: fr
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tous droits réservés · <a href='https://geostru.ai/fr/terms-of-service/' target='_blank' rel='noopener'>Conditions d'utilisation</a> · <a href='https://geostru.ai/fr/intellectual-property/' target='_blank' rel='noopener'>Propriété intellectuelle</a>"
          name: Français
          build: true
          nav_translations: { "Privacy e GDPR": "Confidentialité & RGPD" }
        - locale: ro
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Toate drepturile rezervate · <a href='https://geostru.ai/ro/terms-of-service/' target='_blank' rel='noopener'>Termeni și condiții</a> · <a href='https://geostru.ai/ro/intellectual-property/' target='_blank' rel='noopener'>Proprietate intelectuală</a>"
          name: Română
          build: true
          nav_translations: { "Privacy e GDPR": "Confidențialitate & GDPR" }
        - locale: es
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Todos los derechos reservados · <a href='https://geostru.ai/es/terms-of-service/' target='_blank' rel='noopener'>Términos del servicio</a> · <a href='https://geostru.ai/es/intellectual-property/' target='_blank' rel='noopener'>Propiedad intelectual</a>"
          name: Español
          build: true
          nav_translations: { "Privacy e GDPR": "Privacidad & RGPD" }
        - locale: pl
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Wszelkie prawa zastrzeżone · <a href='https://geostru.ai/en/terms-of-service/' target='_blank' rel='noopener'>Regulamin</a> · <a href='https://geostru.ai/en/intellectual-property/' target='_blank' rel='noopener'>Własność intelektualna</a>"
          name: Polski
          build: true
          nav_translations: { "Privacy e GDPR": "Prywatność & RODO" }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc: { permalink: true, toc_depth: 3 }

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru

nav:
  - Privacy e GDPR: it/index.md
