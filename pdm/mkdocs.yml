site_name: PDM NX — Piano di manutenzione
site_url: https://help.nx.geostru.ai/pdm/
site_author: ENGSOFT SRL — GeoStru
site_description: 'Manuale di PDM NX: piano di manutenzione nel browser, archivio
  GeoStru, controlli, interventi, cronoprogramma e relazione Word.'
copyright: © <span id='pdm-copyright-year'></span> ENGSOFT SRL — GeoStru. Tutti i
  diritti riservati.
repo_name: EngSoft-Geostru/geostru-help-nx
repo_url: https://github.com/EngSoft-Geostru/geostru-help-nx
edit_uri: edit/main/pdm/docs/
docs_dir: docs
theme:
  name: material
  custom_dir: ../_shared/overrides
  language: it
  palette:
  - scheme: default
    primary: blue
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Tema scuro
  - scheme: slate
    primary: blue
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Tema chiaro
  features:
  - navigation.tracking
  - navigation.sections
  - navigation.top
  - navigation.indexes
  - navigation.footer
  - search.highlight
  - search.suggest
  - search.share
  - content.code.copy
  - content.action.edit
  - toc.follow
  font:
    text: Inter
    code: JetBrains Mono
plugins:
- search:
    lang:
    - it
- i18n:
    docs_structure: folder
    reconfigure_material: true
    reconfigure_search: true
    languages:
    - locale: it
      name: Italiano
      default: true
      build: true
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- footnotes
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.snippets
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.tilde
- pymdownx.arithmatex:
    generic: true
- toc:
    permalink: true
    toc_depth: 3
extra_javascript:
- assets/copyright.js
extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
  - icon: fontawesome/solid/globe
    link: https://www.geostru.ai
    name: GeoStru
  - icon: fontawesome/brands/youtube
    link: https://www.youtube.com/@GeoStruSoftware
    name: YouTube
nav:
- Home: it/index.md
- Guida rapida (5 minuti): it/quickstart.md
- Flusso di lavoro: it/workflow.md
- Opere, unità ed elementi: it/struttura.md
- Archivio e cataloghi: it/archivio.md
- Prestazioni, controlli e interventi: it/manutenzione.md
- Immagini e frontespizio: it/immagini.md
- Cronoprogramma: it/cronoprogramma.md
- Relazione Word: it/relazione.md
- Assistente AI: it/assistente.md
- Salvataggio e formati: it/formati.md
- Esempio complesso: it/esempio-complesso.md
- Glossario: it/glossario.md
- Domande frequenti: it/faq.md
