site_name: "Loadcap NX"
site_url: "https://help.nx.geostru.ai/loadcap/"
site_author: GeoStru
site_description: "Manuale utente di Loadcap NX — Capacità portante delle fondazioni."
copyright: "© GeoStru — <a href='https://www.geostru.ai' target='_blank' rel='noopener'>www.geostru.ai</a>"

# repo_name / repo_url / edit_uri rimossi: il sito è destinato all'utente finale
# e non vogliamo esporre il repo GitHub dei sorgenti dalla navbar.

docs_dir: docs

theme:
  name: material
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Guida rapida (5 minuti): Quick start (5 minutes)
            Fondazione e geometria: Foundation and geometry
            Stratigrafia e falda: Stratigraphy and water table
            Carichi e combinazioni: Loads and combinations
            Azione sismica: Seismic action
            Capacità portante: Bearing capacity
            Cedimenti: Settlements
            Stato tensionale e 3D: Stress state and 3D model
            Assistente AI: AI assistant
            Relazione ed esportazioni: Report and exports
            Progetti di esempio: Example projects
            Domande frequenti: FAQ

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.highlight: { anchor_linenums: true }
  - toc: { permalink: true, toc_depth: 3 }

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru

nav:
  - Home: it/index.md
  - Guida rapida (5 minuti): it/quickstart.md
  - Fondazione e geometria: it/geometria.md
  - Stratigrafia e falda: it/stratigrafia.md
  - Carichi e combinazioni: it/carichi.md
  - Azione sismica: it/sismica.md
  - Capacità portante: it/carico-limite.md
  - Cedimenti: it/cedimenti.md
  - Stato tensionale e 3D: it/stato-tensionale.md
  - Assistente AI: it/assistente-ai.md
  - Relazione ed esportazioni: it/relazione.md
  - Progetti di esempio: it/esempi.md
  - Domande frequenti: it/faq.md
