site_name: "Slope NX — Stabilità dei pendii"
site_url: "https://help.nx.geostru.ai/slope/"
site_author: GeoStru
site_description: "Manuale utente di Slope NX — analisi di stabilità dei pendii con il metodo dell'equilibrio limite (Fellenius, Bishop, Janbu, Spencer, Morgenstern-Price), superfici circolari e generiche, falda, carichi, sismica e opere di sostegno (muri, gabbioni). Verifica NTC/EC con coefficienti parziali, anteprima 2D/3D e assistente AI."
copyright: "© GeoStru — <a href='https://www.geostru.ai' target='_blank' rel='noopener'>www.geostru.ai</a>"
repo_name: EngSoft-Geostru/geostru-help-nx
repo_url: https://github.com/EngSoft-Geostru/geostru-help-nx
edit_uri: edit/main/slope/docs/

docs_dir: docs

theme:
  name: material
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Guida rapida (5 minuti): Quick start (5 minutes)
            Flusso di lavoro completo: Full workflow
            Metodi di calcolo (LEM): Calculation methods (LEM)
            Normativa e coefficienti parziali: Design code and partial factors
            Opere di sostegno (muri e gabbioni): Retaining structures (walls and gabions)
            Azione sismica: Seismic action
            Formati file ed esportazione: File formats and export
            Domande frequenti: FAQ

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.arithmatex: { generic: true }
  - toc: { permalink: true, toc_depth: 3 }

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube

# Nav unico in lingua di default (it/). Il plugin i18n lo replica per ogni lingua.
nav:
  - Home: it/index.md
  - Guida rapida (5 minuti): it/quickstart.md
  - Flusso di lavoro completo: it/workflow.md
  - Metodi di calcolo (LEM): it/metodi.md
  - Normativa e coefficienti parziali: it/normativa.md
  - Opere di sostegno (muri e gabbioni): it/muri.md
  - Azione sismica: it/sismica.md
  - Formati file ed esportazione: it/formati.md
  - Domande frequenti: it/faq.md
