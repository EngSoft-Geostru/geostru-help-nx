# Template MkDocs per i manuali GeoStru NX.
# Quando crei un nuovo prodotto: copia questa cartella, rinominala (es. liquiter/),
# e aggiorna i campi marcati [CAMBIA] qui sotto.

site_name: "[CAMBIA] Nome Prodotto NX"               # es. "GMS NX — Geomechanical Survey"
site_url: "https://help.nx.geostru.ai/[CAMBIA]/"   # es. https://help.nx.geostru.ai/gms/
site_author: GeoStru
site_description: "[CAMBIA] Manuale utente di [Prodotto] NX, suite GeoStru."
copyright: "© GeoStru — <a href='https://www.geostru.ai' target='_blank' rel='noopener'>www.geostru.ai</a>"

# Repo GitHub volutamente NON esposto in navbar (utente finale).
# Riabilita repo_name/repo_url/edit_uri solo se il prodotto è destinato a
# documentazione tecnica interna o open source dove vuoi il link al repo.

docs_dir: docs

theme:
  name: material
  language: it
  logo: img/logo.svg
  favicon: img/favicon.ico
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    # NB: NON usare navigation.instant con il plugin i18n: lo switcher di lingua
    # contestuale non è compatibile e fa fallire la build --strict.
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang:
        - it
        - en
  # i18n: una build per lingua. La lingua di default (it) è servita sulla ROOT
  # del prodotto (/prodotto/), le altre sotto /prodotto/<locale>/. Ogni lingua
  # mostra SOLO il proprio nav/TOC; lo switcher è generato automaticamente.
  # Struttura docs/: una sottocartella per lingua → docs/it/, docs/en/, ...
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        # Decommenta quando i contenuti della lingua sono pronti (cartella docs/<locale>/).
        # - locale: en
        #   name: English
        #   build: true
        #   # Traduci le etichette del nav che NON derivano da un H1 di pagina
        #   # (titoli di gruppo/sezione). Una riga per ogni etichetta da tradurre:
        #   nav_translations:
        #     Guida rapida: Quick start
        # - locale: es
        #   name: Español
        #   build: true
        #   nav_translations:
        #     Guida rapida: Guía rápida
        # - locale: ro
        #   name: Română
        #   build: true
        #   nav_translations:
        #     Guida rapida: Ghid rapid

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false  # nasconde "Made with Material for MkDocs" in footer
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube
  # Lo switcher di lingua è generato automaticamente dal plugin i18n
  # (reconfigure_material) a partire dall'elenco `languages`. NON definire
  # qui `alternate:` manualmente.

# nav: UN SOLO albero, in lingua di default, con i path prefissati it/ (la
# cartella della lingua). Il plugin i18n replica il nav per ogni lingua
# scambiando it/ → <locale>/ e traducendo le etichette via nav_translations.
# Esempio:
# nav:
#   - Home: it/index.md
#   - Quickstart: it/quickstart.md
#   - Workflow completo: it/workflow.md
#   - Capitoli specifici:
#     - Stereonet: it/stereonet.md
#     - Markland: it/markland.md
#   - Glossario: it/glossario.md
#   - Formati file: it/formati.md
#   - FAQ: it/faq.md
