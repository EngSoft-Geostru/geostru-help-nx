site_name: "Maps NX"
site_url: "https://help.nx.geostru.ai/maps/"
site_author: GeoStru
site_description: "Manuale utente di Maps NX — cartografia, quote dal modello del terreno, sezioni ed esportazione CAD."
copyright: "© GeoStru — <a href='https://www.geostru.ai' target='_blank' rel='noopener'>www.geostru.ai</a>"

# repo_name / repo_url / edit_uri rimossi: il sito è destinato all'utente finale
# e non vogliamo esporre il repo GitHub dei sorgenti dalla navbar.

docs_dir: docs

theme:
  name: material
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Guida rapida (5 minuti): Quick start (5 minutes)
            Disegnare sulla mappa: Drawing on the map
            Quote e modello del terreno: Elevations and terrain model
            Sezioni e profili: Sections and profiles
            Esportazione e coordinate: Export and coordinates
            Domande frequenti: FAQ

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets
  # pymdownx.tilde serve ai pedici tipo k~h~: non è nel template e senza di esso
  # online compaiono le tilde letterali (incidente MRE, 2026-08-21).
  - pymdownx.tilde
  - pymdownx.highlight: { anchor_linenums: true }
  - toc: { permalink: true, toc_depth: 3 }

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube

# Nav unico in lingua di default (it/). Il plugin i18n lo replica per ogni lingua.
nav:
  - Home: it/index.md
  - Guida rapida (5 minuti): it/quickstart.md
  - Disegnare sulla mappa: it/disegno.md
  - Quote e modello del terreno: it/quote.md
  - Sezioni e profili: it/sezioni.md
  - Esportazione e coordinate: it/esportazione.md
  - Domande frequenti: it/faq.md
