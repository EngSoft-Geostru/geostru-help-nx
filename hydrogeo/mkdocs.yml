site_name: "Hydrogeo NX — Dati pluviometrici"
site_url: "https://help.nx.geostru.ai/hydrogeo/"
site_author: GeoStru
site_description: "Manuale utente di Hydrogeo NX — le stazioni pluviometriche italiane su mappa: Annali Idrologici ISPRA e servizi regionali, massimi annui di pioggia da 1 a 24 ore e da 1 a 5 giorni, precipitazioni mensili, ricerca con l'assistente AI, esportazioni CSV, Excel, PDF e PLV, collegamento con Runoff Lab NX."
copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"
# repo_name / repo_url / edit_uri rimossi: il sito è destinato all'utente finale
# e non vogliamo esporre il repo GitHub dei sorgenti dalla navbar.

docs_dir: docs

theme:
  name: material
  custom_dir: ../_shared/overrides
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    # NB: niente navigation.instant con il plugin i18n (lo switcher di lingua fa fallire la build --strict).
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"
          name: Italiano
          default: true
          build: true
        - locale: en
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. All rights reserved · <a href='https://geostru.ai/en/terms-of-service/' target='_blank' rel='noopener'>Terms of Service</a> · <a href='https://geostru.ai/en/intellectual-property/' target='_blank' rel='noopener'>Intellectual property</a>"
          name: English
          build: true
          # site_name per-locale: senza, l'header delle pagine EN resta in italiano.
          site_name: "Hydrogeo NX — Rainfall data"
          # ⚠️ Queste voci sono di Hydrogeo e devono coincidere, lettera per lettera, con le etichette
          # del nav qui sotto: una voce che non coincide non dà errori, resta in italiano e nessuno
          # avvisa. `mkdocs build` deve stampare «Translated 11 navigation elements» (tutte tranne Home).
          nav_translations:
            Guida rapida (5 minuti): Quick start (5 minutes)
            Il lavoro completo: The complete workflow
            Mappa e scheda della stazione: Map and station sheet
            Tabelle dei dati: Data tables
            Assistente AI: AI assistant
            Esportazioni e formati: Exports and formats
            Collegamenti con le altre app NX: Links with the other NX apps
            Accesso e crediti: Access and credits
            Fonti e limiti dei dati: Data sources and limits
            Glossario: Glossary
            Domande frequenti: FAQ

markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tilde          # pedici V~s~, V~p~, T~p~, t~corr~, E~d~, z~0~ (e ~~barrato~~)
  - pymdownx.arithmatex: { generic: true }
  - toc: { permalink: true, toc_depth: 3 }

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube

# Nav unico in lingua di default (it/). Il plugin i18n lo replica per ogni lingua.
# quickstart, workflow e faq sono gli indirizzi pubblicati prima del 12/11/2026: non rinominarli.
nav:
  - Home: it/index.md
  - Guida rapida (5 minuti): it/quickstart.md
  - Il lavoro completo: it/workflow.md
  - Mappa e scheda della stazione: it/mappa.md
  - Tabelle dei dati: it/dati.md
  - Assistente AI: it/assistente.md
  - Esportazioni e formati: it/formati.md
  - Collegamenti con le altre app NX: it/integrazioni.md
  - Accesso e crediti: it/crediti.md
  - Fonti e limiti dei dati: it/fonti.md
  - Glossario: it/glossario.md
  - Domande frequenti: it/faq.md
