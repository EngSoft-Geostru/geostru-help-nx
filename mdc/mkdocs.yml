site_name: "MDC NX — Muri di sostegno"
site_url: "https://help.nx.geostru.ai/mdc/"
site_author: GeoStru
site_description: "Manuale utente di MDC NX — muri di sostegno a mensola, a gravità, su pali e con tiranti: spinte, scorrimento, ribaltamento, carico limite, sisma NTC 2018, sezioni in c.a., armature e distinta, relazione Word e sezione in DXF."
copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"
repo_name: EngSoft-Geostru/geostru-help-nx
repo_url: https://github.com/EngSoft-Geostru/geostru-help-nx
edit_uri: edit/main/mdc/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: ../_shared/overrides
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    # NB: niente navigation.instant con il plugin i18n (lo switcher di lingua fa fallire la build --strict).
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"
          name: Italiano
          default: true
          build: true
        - locale: en
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. All rights reserved · <a href='https://geostru.ai/en/terms-of-service/' target='_blank' rel='noopener'>Terms of Service</a> · <a href='https://geostru.ai/en/intellectual-property/' target='_blank' rel='noopener'>Intellectual property</a>"
          name: English
          build: true
          # site_name per-locale: senza, l'header delle pagine EN resta in italiano.
          site_name: "MDC NX — Retaining walls"
          # Le voci devono coincidere lettera per lettera con il nav: `mkdocs build` deve stampare «Translated 23 navigation elements».
          nav_translations:
            Guida rapida (5 minuti): Quick start (5 minutes)
            Flusso di lavoro: Workflow
            Dati del progetto: Project data
            Dati generali e tipologia: General data and wall type
            Geometria: Geometry
            Terreni e falda: Soils and water table
            Carichi: Loads
            Materiali: Materials
            Normativa e sisma: Code and seismic action
            Pali e tiranti: Piles and anchors
            Risultati: Results
            Combinazioni e verifiche: Combinations and checks
            Sezioni, armature e distinta: Sections, reinforcement and bar schedule
            Relazione, DXF e crediti: Report, DXF and credits
            Assistente AI: AI assistant
            File, progetti del desktop e GeoDropbox: Files, desktop projects and GeoDropbox
            Cenni teorici: Theory
            Spinte e sisma: Earth pressure and seismic action
            Verifiche globali: Global checks
            Sezioni in c.a., pali e tiranti: RC sections, piles and anchors
            Glossario: Glossary
            Validazione e limiti: Validation and limits
            Domande frequenti: FAQ

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tilde          # pedici K~a~, k~h~, γ~R~ (e ~~barrato~~)
  - pymdownx.arithmatex: { generic: true }
  - toc: { permalink: true, toc_depth: 3 }

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube

# Nav unico in lingua di default (it/). I nomi dei file sono gli slug a cui punta il modale «?» dell'app: non vanno rinominati.
nav:
  - Home: it/index.md
  - Guida rapida (5 minuti): it/quickstart.md
  - Flusso di lavoro: it/workflow.md
  - Dati del progetto:
      - Dati generali e tipologia: it/progetto.md
      - Geometria: it/geometria.md
      - Terreni e falda: it/terreno.md
      - Carichi: it/carichi.md
      - Pali e tiranti: it/pali-tiranti.md
      - Materiali: it/materiali.md
      - Normativa e sisma: it/sisma.md
  - Risultati:
      - Combinazioni e verifiche: it/verifiche.md
      - Sezioni, armature e distinta: it/armature.md
      - Relazione, DXF e crediti: it/relazione.md
  - Assistente AI: it/assistente.md
  - File, progetti del desktop e GeoDropbox: it/file.md
  - Cenni teorici:
      - Spinte e sisma: it/teoria-spinte.md
      - Verifiche globali: it/teoria-verifiche.md
      - Sezioni in c.a., pali e tiranti: it/teoria-strutture.md
  - Glossario: it/glossario.md
  - Validazione e limiti: it/validazione.md
  - Domande frequenti: it/faq.md
