site_name: "MASW NX — Prova MASW"
site_url: "https://help.nx.geostru.ai/masw/"
site_author: GeoStru
site_description: "Manuale utente di MASW NX — elaborazione della prova MASW (Multichannel Analysis of Surface Waves): tracce SEG-2, SEG-Y, SU e ASCII, spettro velocità di fase – frequenza, picking della curva di dispersione delle onde di Rayleigh su più modi, inversione del profilo Vs, Vs,eq, categoria di sottosuolo NTC 2018 e NTC 2008, parametri elastici dinamici, relazione Word, DXF e PDF."
copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"
repo_name: EngSoft-Geostru/geostru-help-nx
repo_url: https://github.com/EngSoft-Geostru/geostru-help-nx
edit_uri: edit/main/masw/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: ../_shared/overrides
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    # NB: niente navigation.instant con il plugin i18n (lo switcher di lingua fa fallire la build --strict).
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"
          name: Italiano
          default: true
          build: true
        - locale: en
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. All rights reserved · <a href='https://geostru.ai/en/terms-of-service/' target='_blank' rel='noopener'>Terms of Service</a> · <a href='https://geostru.ai/en/intellectual-property/' target='_blank' rel='noopener'>Intellectual property</a>"
          name: English
          build: true
          # site_name per-locale: senza, l'header delle pagine EN resta in italiano.
          site_name: "MASW NX — MASW survey"
          # ⚠️ Queste voci sono di MASW e devono coincidere, lettera per lettera, con le etichette
          # del nav qui sotto: una voce che non coincide non dà errori, resta in italiano e nessuno
          # avvisa. `mkdocs build` deve stampare «Translated 11 navigation elements» (tutte tranne Home).
          nav_translations:
            Guida rapida (5 minuti): Quick start (5 minutes)
            Tracce: Traces
            Spettro f-v e picking: f-v spectrum and picking
            Inversione: Inversion
            Categoria di sottosuolo e parametri: Soil category and parameters
            Relazione, DXF, PDF e crediti: Report, DXF, PDF and credits
            Assistente AI: AI assistant
            File, progetti del desktop e GeoDropbox: Files, desktop projects and GeoDropbox
            Cenni teorici: Theory
            Validazione e differenze dal desktop: Validation and differences from the desktop version
            Domande frequenti: FAQ

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tilde          # pedici V~s~, V~s,eq~, V~p~, G~0~, E~d~, M~0~, λ~min~ (e ~~barrato~~)
  - pymdownx.arithmatex: { generic: true }
  - toc: { permalink: true, toc_depth: 3 }

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube

# Nav unico in lingua di default (it/). Il plugin i18n lo replica per ogni lingua.
# I nomi dei file sono gli slug a cui punta il modale «?» dell'app (quickstart, tracce,
# spettri, relazione, teoria, validazione): non vanno rinominati.
nav:
  - Home: it/index.md
  - Guida rapida (5 minuti): it/quickstart.md
  - Tracce: it/tracce.md
  - Spettro f-v e picking: it/spettri.md
  - Inversione: it/inversione.md
  - Categoria di sottosuolo e parametri: it/categoria.md
  - Relazione, DXF, PDF e crediti: it/relazione.md
  - Assistente AI: it/assistente.md
  - File, progetti del desktop e GeoDropbox: it/file.md
  - Cenni teorici: it/teoria.md
  - Validazione e differenze dal desktop: it/validazione.md
  - Domande frequenti: it/faq.md
