site_name: "GeoTheis NX — Prove di emungimento"
site_url: "https://help.nx.geostru.ai/geotheis/"
site_author: GeoStru
site_description: "Manuale utente di GeoTheis NX: prove di emungimento sui pozzi per acqua (gradini di portata, portata costante e risalita), interpretazione con Theis, Cooper-Jacob, Hantush, Dupuit-Thiem e curva caratteristica, valore di progetto, portata concedibile e relazione Word."
copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"
repo_name: EngSoft-Geostru/geostru-help-nx
repo_url: https://github.com/EngSoft-Geostru/geostru-help-nx
edit_uri: edit/main/geotheis/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: ../_shared/overrides
  language: it
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tema scuro
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tema chiaro
  features:
    # NB: niente navigation.instant con il plugin i18n (lo switcher di lingua fa fallire la build --strict).
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: it
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. Tutti i diritti riservati · <a href='https://geostru.ai/it/terms-of-service/' target='_blank' rel='noopener'>Condizioni d'uso</a> · <a href='https://geostru.ai/it/intellectual-property/' target='_blank' rel='noopener'>Proprietà intellettuale</a>"
          name: Italiano
          default: true
          build: true
        - locale: en
          copyright: "© <script>document.write(new Date().getFullYear())</script> ENGSOFT SRL — GeoStru. All rights reserved · <a href='https://geostru.ai/en/terms-of-service/' target='_blank' rel='noopener'>Terms of Service</a> · <a href='https://geostru.ai/en/intellectual-property/' target='_blank' rel='noopener'>Intellectual property</a>"
          name: English
          build: true
          # site_name per-locale: senza, l'header delle pagine EN resta in italiano.
          site_name: "GeoTheis NX — Pumping tests"
          # Le voci devono coincidere lettera per lettera con il nav: `mkdocs build` deve stampare «Translated 13 navigation elements».
          nav_translations:
            "Guida rapida (5 minuti)": "Quick start (5 minutes)"
            "Flusso di lavoro": "Workflow"
            "Il pozzo: sito, stratigrafia, completamento": "The well: site, stratigraphy, completion"
            "Prove a gradini e a portata costante": "Step-drawdown and constant-rate tests"
            "Metodi d'interpretazione": "Interpretation methods"
            "Risultati": "Results"
            "Relazione e crediti": "Report and credits"
            "Assistente AI": "AI assistant"
            "File, esempi e GeoDropbox": "Files, examples and GeoDropbox"
            "Cenni teorici": "Theory"
            "Glossario": "Glossary"
            "Validazione e differenze dal desktop": "Validation and differences from the desktop"
            "Domande frequenti": "FAQ"

# Toglie i blocchi <!-- riservato --> (solo per l'assistente AI) prima di costruire pagine e indice di ricerca.
hooks:
  - ../_shared/hooks/riservato.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.snippets
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tilde          # pedici T~min~, a~max~, SA~m~ (e ~~barrato~~)
  - pymdownx.arithmatex: { generic: true }
  - toc: { permalink: true, toc_depth: 3 }

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  homepage: https://help.nx.geostru.ai/
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.geostru.ai
      name: GeoStru
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@GeoStruSoftware
      name: YouTube

# Nav unico in lingua di default (it/). I nomi dei file sono gli slug a cui punta il modale «?» dell'app: non vanno rinominati.
nav:
  - "Home": it/index.md
  - "Guida rapida (5 minuti)": it/quickstart.md
  - "Flusso di lavoro": it/workflow.md
  - "Il pozzo: sito, stratigrafia, completamento": it/pozzo.md
  - "Prove a gradini e a portata costante": it/prove.md
  - "Metodi d'interpretazione": it/metodi.md
  - "Risultati": it/risultati.md
  - "Relazione e crediti": it/relazione.md
  - "Assistente AI": it/assistente.md
  - "File, esempi e GeoDropbox": it/file.md
  - "Cenni teorici": it/teoria.md
  - "Glossario": it/glossario.md
  - "Validazione e differenze dal desktop": it/validazione.md
  - "Domande frequenti": it/faq.md
